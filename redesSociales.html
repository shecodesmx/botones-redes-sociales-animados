<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">B
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botones de Redes Sociales Animados</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="particles" id="particles"></div>  
    <div class="container">
        <h1>Animated Social Networks</h1>
        <div class="buttons-grid">
            <a href="#" class="social-btn facebook">
                <i class="fab fa-facebook-f"></i>
                <span>Facebook</span>
            </a>
            <a href="#" class="social-btn instagram">
                <i class="fab fa-instagram"></i>
                <span>Instagram</span>
            </a>
            <a href="#" class="social-btn twitter">
                <i class="fab fa-twitter"></i>
                <span>Twitter</span>
            </a>
            <a href="#" class="social-btn youtube">
                <i class="fab fa-youtube"></i>
                <span>YouTube</span>
            </a>
            <a href="#" class="social-btn tiktok">
                <i class="fab fa-tiktok"></i>
                <span>TikTok</span>
            </a>
            <a href="#" class="social-btn linkedin">
                <i class="fab fa-linkedin-in"></i>
                <span>LinkedIn</span>
            </a>
            <a href="#" class="social-btn whatsapp">
                <i class="fab fa-whatsapp"></i>
                <span>WhatsApp</span>
            </a>
            <a href="#" class="social-btn snapchat">
                <i class="fab fa-snapchat-ghost"></i>
                <span>Snapchat</span>
            </a>
            <a href="#" class="social-btn pinterest">
                <i class="fab fa-pinterest-p"></i>
                <span>Pinterest</span>
            </a>
            <a href="#" class="social-btn spotify">
                <i class="fab fa-spotify"></i>
                <span>Spotify</span>
            </a>
            <a href="#" class="social-btn discord">
                <i class="fab fa-discord"></i>
                <span>Discord</span>
            </a>
            <a href="#" class="social-btn telegram">
                <i class="fab fa-telegram"></i>
                <span>Telegram</span>
            </a>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
